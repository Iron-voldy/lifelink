name: Agent Service CI
on:
  push:
    branches: [ main, master ]
    paths: [ 'agentic-ai/**', '.github/workflows/agent-ci.yml' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'agentic-ai/**', '.github/workflows/agent-ci.yml' ]
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
