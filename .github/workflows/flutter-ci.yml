name: Flutter CI
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'mobile/**', '.github/workflows/flutter-ci.yml' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'mobile/**', '.github/workflows/flutter-ci.yml' ]
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android platform project when absent
        run: test -d android || flutter create --project-name lifelink_mobile --platforms android .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=LIFELINK_API_BASE_URL=${{ vars.LIFELINK_API_BASE_URL || 'https://api.example.invalid' }} --dart-define=LIFELINK_FIREBASE_ENABLED=false
      - uses: actions/upload-artifact@v4
        with:
          name: lifelink-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
