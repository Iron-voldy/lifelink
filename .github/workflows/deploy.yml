name: Deploy to VPS
# Continuous delivery: every push to main is tested, shipped to the Hostinger VPS, then smoke-tested on the public URLs.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'backend/**', 'agentic-ai/**', 'web/**', 'deploy/vps/**', '.github/workflows/deploy.yml' ]
permissions:
  contents: read
# Never run two deploys at once; a newer push waits for the running one instead of cancelling it half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WEB_URL: https://lifelink.72-62-255-113.sslip.io
  API_URL: https://lifelink-api.72-62-255-113.sslip.io

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test backend/LifeLink.sln --verbosity minimal

  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: [ backend-tests, agent-tests, web-tests ]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.WEB_URL }}
    env:
      HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Explain a skipped deploy
        if: env.HAS_KEY != 'true'
        run: echo "::warning::VPS_SSH_KEY secret is not set, so the deploy was skipped. See RUN_COMMANDS.md section 7."
      - name: Install SSH key
        if: env.HAS_KEY == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pin the server's host key when it is provided; otherwise trust the key seen on first contact.
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else ssh-keyscan -H "${{ vars.VPS_HOST || '72.62.255.113' }}" > ~/.ssh/known_hosts; fi
      - name: Upload sources and rebuild containers
        if: env.HAS_KEY == 'true'
        # Same command as the manual redeploy; .env on the server keeps its generated secrets and is never overwritten.
        run: |
          tar --exclude=bin --exclude=obj --exclude=.venv --exclude=__pycache__ --exclude=.pytest_cache \
              --exclude=node_modules --exclude=dist --exclude=.env -czf - backend agentic-ai web deploy/vps \
            | ssh -i ~/.ssh/deploy_key "root@${{ vars.VPS_HOST || '72.62.255.113' }}" \
                'cd /opt/lifelink && tar -xzf - && bash deploy/vps/deploy.sh'
      - name: Smoke test the public site
        if: env.HAS_KEY == 'true'
        run: |
          curl -fsS "$API_URL/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/hospitals/me")" = 401
          curl -fsSI "$WEB_URL/hospital" | grep -qi '^cache-control: no-cache'
          echo "Deployed and healthy: $WEB_URL"
