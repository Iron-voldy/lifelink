server {
  listen 8080;
  server_name _;
  server_tokens off;
  # This file replaces the image's default.conf, so the web root must be set explicitly.
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    # Keep the real client address set by the host nginx so the API rate limits per person, not per proxy.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health/api {
    proxy_pass http://api:8080/health;
  }

  location / {
    # Security headers for the SPA itself (the API sets its own). The script hash allows only the inline theme
    # bootstrap in index.html; if that script changes, recompute: sha256 of its exact text, base64-encoded.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-f7tzawfmpwUOo6OHvdF7UD/qEWgu0oJFH7cK6Q+uDJo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    try_files $uri $uri/ /index.html;
  }
}
