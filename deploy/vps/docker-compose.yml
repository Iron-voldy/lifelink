# Full stack for a shared VPS: Postgres + agent service + API + React web.
# Nothing is published publicly; api/web bind to 127.0.0.1 and are exposed through the host's nginx (see nginx-lifelink-*.conf).
# Secrets live in ./.env next to this file (generated by deploy.sh, never committed).
name: lifelink
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifelink
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: ["lifelink-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink -d lifelink"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: ../../agentic-ai
    restart: unless-stopped
    environment:
      LIFELINK_ENVIRONMENT: production
      LIFELINK_INTERNAL_API_KEY: ${AGENT_INTERNAL_API_KEY:?}
      LIFELINK_MODEL_PROVIDER: deterministic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ../../backend
    restart: unless-stopped
    environment:
      # Staging keeps the strict secret checks but allows the demo-data seeder (which refuses Production).
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Staging}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LifeLink: Host=postgres;Port=5432;Database=lifelink;Username=lifelink;Password=${POSTGRES_PASSWORD:?}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      AgentService__BaseUrl: http://agent:8000
      AgentService__InternalApiKey: ${AGENT_INTERNAL_API_KEY:?}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-http://localhost:5300}
      Database__MigrateOnStartup: "true"
      # nginx (host and web container) overwrites X-Real-IP; the API port is bound to 127.0.0.1 only.
      Security__TrustProxyClientIp: "true"
      Bootstrap__Enabled: "true"
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@lifelink.local}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?}
      DemoData__Enabled: ${DEMO_DATA_ENABLED:-false}
      DemoData__Password: ${DEMO_DATA_PASSWORD:-}
    ports: ["127.0.0.1:5090:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      agent: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ../../web
      # "/" makes the SPA call same-origin /api/*, which the image's nginx proxies to the api service (no CORS needed).
      args: { VITE_API_BASE_URL: / }
    restart: unless-stopped
    ports: ["127.0.0.1:5091:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  lifelink-postgres:
