# /etc/nginx/sites-available/lifelink-web  (HTTPS is added by: certbot --nginx -d <server_name>)
server {
    listen 80;
    server_name lifelink.72-62-255-113.sslip.io;

    client_max_body_size 5m;
    server_tokens off;
    # Takes effect once certbot adds the 443 listener to this block; browsers ignore it on plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:5091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
