name: lifelink_mobile
description: LifeLink donor and hospital field application.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/care-team.jpg
    - assets/images/donation.jpg
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/dm-sans-400.ttf
          weight: 400
        - asset: assets/fonts/dm-sans-600.ttf
          weight: 600
        - asset: assets/fonts/dm-sans-700.ttf
          weight: 700
